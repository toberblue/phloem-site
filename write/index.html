    <!-- THE PALETTE (2026-08-12). Every colour in Phloem is a token declared
         in this file; style.css carries structure and reads them through
         var(). It is linked here rather than imported by main.ts for two
         reasons: a <link> in <head> is render-blocking, so the page never
         flashes an unpainted frame, and a file under public/ is served
         verbatim, which is what lets the workbench swap it for a sibling at
         runtime without a rebuild. An ordinary build loads this one file and
         nothing else — the swapping lives behind the workbench's flag. -->
    <link rel="stylesheet" id="phloem-palette" href="/write/themes/default.css" />
